LABEL hyper
TEXT HELP
Boot the Hyper OS install medium on BIOS.
It allows you to install Hyper OS or perform system maintenance.
ENDTEXT
MENU LABEL Hyper OS install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

# Manual / CLI install: no graphical desktop, straight to a root shell
LABEL manual
TEXT HELP
Boot Hyper OS into a plain terminal.
Pick disks, run archinstall, or go fully hands-on with cfdisk and pacstrap.
ENDTEXT
MENU LABEL Hyper OS — manual / CLI install (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target

# Accessibility boot option
LABEL hyper-speech
TEXT HELP
Boot the Hyper OS install medium on BIOS with speakup screen reader.
It allows you to install Hyper OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Hyper OS install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on
# Hyper OS — Calamares installer settings
# Look & behaviour live in etc/calamares/branding/hyper-os.

modules-search: [ /usr/lib/calamares/modules, /usr/share/calamares/modules ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - hyperprep
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - initcpio
      - users
      - displaymanager
      - hypergpu
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding:               hyper-os
prompt-install:         false
dont-chroot:            false
oem-setup:              false
disable-cancel:         false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end:            false
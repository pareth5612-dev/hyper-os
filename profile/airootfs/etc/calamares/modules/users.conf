# Hyper OS — single-user system, zsh, wheel sudo.
---
defaultGroups:
  - users
  - audio
  - video
  - storage
  - optical
  - lp
  - network
  - rfkill
  - name: wheel
    must_exist: false
    system: true

sudoersGroup:   wheel

# root gets the same password as the user, unless the user unchecks it
setRootPassword: true
doReusePassword: true

# autologin is offered, but left unset by default
displayAutologin: true
doAutologin: false
autologinGroup: autologin

allowWeakPasswords: false
allowWeakPasswordsDefault: false
passwordRequirements:
    minLength: -1
    maxLength: -1

user:
  shell: /usr/bin/zsh
  forbidden_names: [ root, hyper ]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${first}"
  forbidden_names: [ localhost ]